name: verify

# Temporarily manual and Ubuntu-only. Automatic push/PR runs and the
# Windows/macOS matrix are disabled until the cross-platform job is hardened.
on:
  workflow_dispatch:

jobs:
  verify:
    name: verify (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Verify compiler, bridge, editor, conformance, and properties
        run: npm run verify

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsharp-evidence-ubuntu
          if-no-files-found: ignore
          path: |
            reports/conformance.json
            reports/conformance.md
            reports/property.json
            reports/property.md
            reports/environment.json
